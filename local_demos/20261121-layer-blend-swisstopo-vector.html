<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MapLibre 6.18: raster-layer-blend with a pattern on a real vector basemap (swisstopo)</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.18.0/dist/maplibre-gl.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    body { display: grid; grid-template: auto 1fr / 1fr 1fr; }
    #controls { grid-column: 1 / 3; margin: 8px; font-size: 14px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    h3 { position: absolute; z-index: 1; margin: 8px; padding: 4px 8px; background: #fffd; font-size: 14px; }
    .map { position: relative; }
  </style>
</head>
<body>
  <div id="controls">
    <label>blend <select id="blend">
      <option>multiply</option><option>screen</option><option>overlay</option>
      <option>darken</option><option>lighten</option><option>normal</option>
    </select></label>
    <label>pattern <select id="pattern">
      <option value="stripes">diagonal stripes</option><option value="checker">checkerboard</option>
    </select></label>
    <label>raster inserted
      <select id="pos">
        <option value="top">on top of everything</option>
        <option value="belowSymbols">below first symbol layer</option>
        <option value="aboveBackground">just above background (below all vector)</option>
      </select></label>
    <label>opacity <input id="opacity" type="range" min="0" max="1" step="0.05" value="1"></label>
    <span id="status"></span>
  </div>
  <div class="map" id="left"><h3>swisstopo vector, no terrain</h3></div>
  <div class="map" id="right"><h3>swisstopo vector, 3D terrain</h3></div>

  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.18.0/dist/maplibre-gl.mjs';

    const styleUrl = 'https://vectortiles.geo.admin.ch/styles/ch.swisstopo.basemap.vt/style.json';
    const center = [7.6586, 45.9763];
    const $ = id => document.getElementById(id);
    const styleJson = await (await fetch(styleUrl)).json();

    // Image covering ~90x45 km around the Matterhorn, 1 cell ~ 1 km.
    const imageCoords = [[7.2, 46.2], [8.1, 46.2], [8.1, 45.75], [7.2, 45.75]];
    const colors = ['#ffd400', '#ff8c00', '#e00000'];
    function patternUrl(kind) {
      const n = 10, cols = 90, rows = 45;
      const c = document.createElement('canvas');
      c.width = cols * n; c.height = rows * n;
      const g = c.getContext('2d');
      for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
        // stripes: colour by diagonal; checker: alternate colour and white on a 3-colour cycle
        g.fillStyle = kind === 'stripes' ? colors[(i + j) % 3] : ((i + j) % 2 ? '#fff' : colors[(i >> 2) % 3]);
        g.fillRect(i * n, j * n, n, n);
      }
      return c.toDataURL();
    }

    // Returns the layer id before which the raster should be inserted (undefined = top).
    function beforeId(style, pos) {
      const layers = style.layers;
      if (pos === 'belowSymbols') return layers.find(l => l.type === 'symbol')?.id;
      if (pos === 'aboveBackground') return layers.find(l => l.type !== 'background')?.id;
    }

    function makeMap(container, terrain) {
      const style = structuredClone(styleJson);
      style.sources.pat = {type: 'image', url: patternUrl($('pattern').value), coordinates: imageCoords};
      if (terrain) {
        style.sources.dem = {type: 'raster-dem', tiles: ['https://tiles.mapterhorn.com/{z}/{x}/{y}.webp'], encoding: 'terrarium',
                             tileSize: 512, maxzoom: 14, attribution: '<a href="https://mapterhorn.com">Mapterhorn</a>'};
        style.terrain = {source: 'dem', exaggeration: 1.5};
      }
      const map = new maplibregl.Map({container, style, center, zoom: 12, pitch: 60, bearing: 20, hash: false});
      map.on('error', e => console.warn(container, e.error?.message ?? e));
      map.once('style.load', () => { apply(map); });
      return map;
    }

    // (Re)creates the pattern raster layer from the current UI state.
    function apply(map) {
      if (map.getLayer('pat-blend')) map.removeLayer('pat-blend');
      map.addLayer({
        id: 'pat-blend', type: 'raster', source: 'pat',
        paint: {
          'raster-layer-blend': $('blend').value,
          'raster-opacity': +$('opacity').value,
          'raster-fade-duration': 0
        }
      }, beforeId(map.getStyle(), $('pos').value));
    }

    const left = makeMap('left', false);
    const right = makeMap('right', true);
    const maps = [left, right];

    $('pattern').addEventListener('input', () =>
      maps.forEach(m => m.getSource('pat').updateImage({url: patternUrl($('pattern').value), coordinates: imageCoords})));

    for (const id of ['blend', 'pos', 'opacity']) {
      $(id).addEventListener('input', () => maps.forEach(apply));
    }

    // Keep both cameras in sync (whichever map the user drives).
    let syncing = false;
    for (const [src, dst] of [[left, right], [right, left]]) {
      src.on('move', () => {
        if (syncing) return;
        syncing = true;
        dst.jumpTo({center: src.getCenter(), zoom: src.getZoom(), bearing: src.getBearing(), pitch: src.getPitch()});
        syncing = false;
      });
    }
  </script>
</body>
</html>
